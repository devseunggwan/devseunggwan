name: Stats Card

on:
  schedule:
    # 30 minutes after profile-3d.yml: both workflows commit to master, and a
    # shared trigger time makes one of the two pushes lose on non-fast-forward.
    - cron: "30 18 * * *"
  workflow_dispatch:
  # workflow_dispatch only reaches workflows already on the default branch,
  # so a PR touching the generator needs its own trigger to prove the render
  # works under secrets.GITHUB_TOKEN before the card goes live.
  pull_request:
    paths:
      - scripts/build_stats_card.py
      - .github/workflows/stats-card.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-stats-card
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR run only reads; leaving the push credential on its runner
          # hands repo-write to code the PR itself introduced.
          persist-credentials: ${{ github.event_name != 'pull_request' }}
      - name: Render stats/stats.svg
        env:
          # Not GITHUB_TOKEN: it sees only public repositories, and 62 of this
          # account's 73 are private, so it renders 1,162 commits where the
          # profile calendar counts 9,463. STATS_TOKEN is a PAT with read
          # access to them.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "::error::STATS_TOKEN secret is not set — see .github/workflows/stats-card.yml"
            exit 1
          }
          python3 scripts/probe_calendar_scope.py "${{ github.repository_owner }}"
      - name: Commit & Push
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stats/stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats card"
          # profile-3d.yml commits to the same branch; a manual dispatch of
          # both at once leaves whichever pushes second behind by one commit.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

name: Stats Card

on:
  schedule:
    # Every 4 hours (00:30, 04:30, ... UTC = 09:30, 13:30, ... KST) so the
    # 31-day graph shows today's activity within hours instead of next day.
    # Minute 30 keeps clear of the top-of-hour rush that delays scheduled runs.
    - cron: "30 */4 * * *"
  workflow_dispatch:
  # workflow_dispatch only reaches workflows already on the default branch,
  # so a PR touching the generator needs its own trigger to prove the render
  # works under secrets.GITHUB_TOKEN before the card goes live.
  pull_request:
    paths:
      - scripts/build_stats_card.py
      - scripts/build_activity_graph.py
      - .github/workflows/stats-card.yml
  # Renders right after a generator change merges, instead of leaving the
  # README pointing at a file that the next scheduled run would create.
  push:
    branches: [master]
    paths:
      - scripts/build_stats_card.py
      - scripts/build_activity_graph.py
      - .github/workflows/stats-card.yml

# Least privilege for both jobs; publish raises its own to write.
permissions:
  contents: read

jobs:
  # Split from publish so a pull_request run never gets a write-capable token.
  # `permissions:` takes no expression, so one job cannot hold both levels —
  # and the code the render step executes is code the PR itself can change.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: verify-stats-card
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Render stats/stats.svg
        env:
          # contributionCalendar answers the same under any token, so the card
          # needs no PAT — measured in CI, every year matched the owner's own
          # while the per-type totals collapsed. See the script's docstring.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats_card.py "${{ github.repository_owner }}" stats/stats.svg
      - name: Render stats/activity.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_activity_graph.py "${{ github.repository_owner }}" stats/activity.svg

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: generate-stats-card
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Render stats/stats.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_stats_card.py "${{ github.repository_owner }}" stats/stats.svg
      - name: Render stats/activity.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_activity_graph.py "${{ github.repository_owner }}" stats/activity.svg
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add stats/stats.svg stats/activity.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats cards"
          # Guards against a push that lands on master while this job runs.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
